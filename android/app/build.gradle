plugins {
    id 'com.android.application'
}

// CryVR is linked into both CrySystem and XRenderVulkan. Package the complete
// native build together so the frame renderer and its embedded shaders cannot
// remain at an older revision than the renderer submitting the draws.
def engineNativeOutput = rootProject.file('../bin/arm64-Release')
def syncEngineNativeLibraries = tasks.register('syncEngineNativeLibraries', Copy) {
    from(engineNativeOutput) {
        include '*.so'
    }
    into('src/main/jniLibs/arm64-v8a')
    onlyIf { engineNativeOutput.isDirectory() }
}
tasks.configureEach {
    if (name == 'preBuild') {
        dependsOn(syncEngineNativeLibraries)
    }
}

android {
    namespace 'com.nearchuckle.farcry'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.nearchuckle.farcry'
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        release {
            storeFile file('farcry.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/*.so']
        }
        resources {
            pickFirsts += ['**/*.so']
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
